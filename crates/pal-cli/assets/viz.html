<title>palimpsest</title>
<style>
  :root { color-scheme: dark; }
  .pal {
    --surface: #161310;
    --surface-2: #1e1913;
    --surface-3: #262019;
    --ink: #e8e2d5;
    --ink-2: #a89e8a;
    --ink-3: #6f6656;
    --line: #2e2820;
    --accent: #c98500;
    --co-edge: #e66767;
    --g0: #3987e5; --g1: #d95926; --g2: #199e70; --g3: #c98500;
    --g4: #d55181; --g5: #008300; --g6: #9085e9; --g7: #6b6355;
    font-family: system-ui, sans-serif;
    background: var(--surface);
    color: var(--ink);
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    font-size: 14px;
  }
  .pal * { box-sizing: border-box; }
  .pal code, .pal .mono { font-family: ui-monospace, "Cascadia Code", Menlo, Consolas, monospace; }

  .hdr {
    display: flex; align-items: baseline; gap: 14px;
    padding: 10px 16px; border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }
  .wordmark {
    font-family: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
    font-style: italic; font-size: 22px; letter-spacing: 0.01em;
    color: var(--ink);
  }
  .repo { color: var(--ink-2); font-size: 14px; }
  .repo b { color: var(--ink); font-weight: 600; }
  .chips { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
  .chip {
    font-size: 12px; color: var(--ink-2);
    border: 1px solid var(--line); border-radius: 3px;
    padding: 3px 8px; background: var(--surface-2);
    font-variant-numeric: tabular-nums;
  }
  .chip b { color: var(--ink); font-weight: 600; }

  .main { flex: 1; display: flex; min-height: 0; }
  .stage { position: relative; flex: 1; min-width: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; }
  canvas.drag { cursor: grabbing; }

  .controls {
    position: absolute; top: 12px; left: 12px;
    display: flex; flex-direction: column; gap: 8px;
    background: color-mix(in srgb, var(--surface-2) 88%, transparent);
    border: 1px solid var(--line); border-radius: 4px;
    padding: 10px 12px; width: 232px;
    backdrop-filter: blur(4px);
  }
  .controls label { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink-2); cursor: pointer; }
  .controls input[type=checkbox] { accent-color: var(--accent); }
  .controls input[type=range] { width: 100%; accent-color: var(--accent); }
  .controls input[type=search] {
    width: 100%; background: var(--surface); color: var(--ink);
    border: 1px solid var(--line); border-radius: 3px; padding: 5px 7px;
    font-size: 12.5px; font-family: inherit;
  }
  .controls input:focus-visible, .pal button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .ctl-lift { display: flex; flex-direction: column; gap: 2px; }
  .ctl-lift .row { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--ink-3); }
  .ctl-lift .row output { color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .swatch { display: inline-block; width: 14px; height: 3px; border-radius: 2px; }

  .legend {
    position: absolute; left: 12px; bottom: 12px;
    background: color-mix(in srgb, var(--surface-2) 88%, transparent);
    border: 1px solid var(--line); border-radius: 4px;
    padding: 8px 12px; font-size: 12px;
    display: grid; grid-template-columns: auto auto; gap: 3px 16px;
    backdrop-filter: blur(4px);
  }
  .legend .it { display: flex; align-items: center; gap: 7px; color: var(--ink-2); }
  .legend .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }

  .tip {
    position: absolute; pointer-events: none; display: none;
    background: var(--surface-3); border: 1px solid var(--line); border-radius: 3px;
    padding: 5px 9px; font-size: 12px; max-width: 380px;
    box-shadow: 0 3px 14px rgba(0,0,0,.45);
  }
  .tip .p { color: var(--ink); word-break: break-all; }
  .tip .m { color: var(--ink-2); font-size: 11px; margin-top: 2px; }

  .panel {
    width: 340px; flex: none; border-left: 1px solid var(--line);
    background: var(--surface-2);
    display: flex; flex-direction: column; min-height: 0;
  }
  .tabs { display: flex; border-bottom: 1px solid var(--line); }
  .tabs button {
    flex: 1; background: none; border: none; color: var(--ink-3);
    font: inherit; font-size: 12.5px; padding: 9px 4px; cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  .panel-body { overflow-y: auto; padding: 10px 12px; flex: 1; }
  .panel-body h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); margin: 10px 0 6px; font-weight: 600; }
  .pair, .prow {
    display: block; width: 100%; text-align: left; background: none; border: none;
    border-bottom: 1px solid var(--line); padding: 7px 2px; cursor: pointer;
    font-family: inherit; color: inherit;
  }
  .pair:hover, .prow:hover { background: var(--surface-3); }
  .pair .f { font-size: 12px; color: var(--ink); word-break: break-all; }
  .pair .f + .f { margin-top: 1px; }
  .pair .m, .prow .m { font-size: 11px; color: var(--ink-2); margin-top: 3px; font-variant-numeric: tabular-nums; }
  .prow .f { font-size: 12px; color: var(--ink); word-break: break-all; display: flex; gap: 6px; align-items: baseline; }
  .prow .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; align-self: center; }
  .kind { font-size: 10.5px; padding: 1px 5px; border-radius: 2px; border: 1px solid var(--line); color: var(--ink-2); }
  .kind.co { color: var(--co-edge); border-color: color-mix(in srgb, var(--co-edge) 40%, var(--line)); }
  .hint { color: var(--ink-3); font-size: 12px; line-height: 1.5; padding: 6px 2px; }
  .selpath { font-size: 12.5px; color: var(--ink); word-break: break-all; padding: 4px 2px 0; }
  .note { border-top: 1px solid var(--line); padding: 8px 12px; font-size: 11.5px; color: var(--ink-3); line-height: 1.45; }
  @media (max-width: 760px) { .panel { display: none; } }
</style>

<div class="pal">
  <div class="hdr">
    <span class="wordmark">palimpsest</span>
    <span class="repo">blast graph of <b id="repo-name"></b> <span class="mono" id="repo-head"></span></span>
    <div class="chips" id="chips"></div>
  </div>
  <div class="main">
    <div class="stage">
      <canvas id="cv" tabindex="0" aria-label="dependency and co-change graph"></canvas>
      <div class="controls">
        <input type="search" id="q" placeholder="find a file..." aria-label="find a file">
        <label><input type="checkbox" id="lv" checked>
          <span class="swatch" style="background:#57503f"></span> structural imports</label>
        <label><input type="checkbox" id="cc" checked>
          <span class="swatch" style="background:var(--co-edge)"></span> co-change coupling</label>
        <div class="ctl-lift">
          <label for="lift" class="row"><span>min lift</span><output id="lifto">20</output></label>
          <input type="range" id="lift" min="2" max="200" value="20" step="1">
        </div>
      </div>
      <div class="legend" id="legend"></div>
      <div class="tip" id="tip"></div>
    </div>
    <div class="panel">
      <div class="tabs" role="tablist">
        <button role="tab" id="t-sel" aria-selected="true">selection</button>
        <button role="tab" id="t-hid" aria-selected="false">hidden coupling</button>
      </div>
      <div class="panel-body" id="body"></div>
      <div class="note">Node color is the package; size is import degree. Faint
        edges are live imports at HEAD; red edges are files that change together
        (weight is decayed co-change). Drag to pan, scroll to zoom, click a node
        to inspect it.</div>
    </div>
  </div>
</div>

<script>
(() => {
  const D = JSON.parse(document.getElementById('data').textContent);
  document.getElementById('repo-name').textContent = D.meta.repo;
  if (D.meta.head) document.getElementById('repo-head').textContent = '@ ' + D.meta.head;
  document.title = 'palimpsest - ' + D.meta.repo;
  const N = D.nodes.length;
  // repo file paths can contain HTML metacharacters; escape anything
  // interpolated into innerHTML
  const esc = s => String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const CSS = getComputedStyle(document.querySelector('.pal'));
  const GC = [0,1,2,3,4,5,6,7].map(i => CSS.getPropertyValue('--g' + i).trim());
  const CO = CSS.getPropertyValue('--co-edge').trim();
  const INK2 = CSS.getPropertyValue('--ink-2').trim();

  // --- header chips ---
  document.getElementById('chips').innerHTML =
    `<span class="chip"><b>${D.meta.files}</b> files</span>` +
    `<span class="chip"><b>${D.meta.commits}</b> commits</span>` +
    `<span class="chip"><b>${D.meta.live}</b> live edges</span>` +
    `<span class="chip"><b>${D.meta.cochange}</b> co-change pairs</span>`;

  // --- legend ---
  const names = D.groups.map(g => g === 'other' ? 'everything else' : g);
  document.getElementById('legend').innerHTML = names.map((g, i) =>
    `<span class="it"><span class="dot" style="background:${GC[i]}"></span>${esc(g)}</span>`).join('');

  // --- layout state ---
  const px = new Float32Array(N), py = new Float32Array(N);
  const vx = new Float32Array(N), vy = new Float32Array(N);
  const deg = D.nodes.map(n => n[2]);
  const R = deg.map(d => 2.2 + Math.sqrt(d) * 1.35);
  const adj = Array.from({length: N}, () => []);
  for (const [a, b] of D.live) { adj[a].push({o: b, t: 'import'}); adj[b].push({o: a, t: 'import'}); }
  for (const [a, b, lift, n, w] of D.co) {
    adj[a].push({o: b, t: 'co', lift, n, w}); adj[b].push({o: a, t: 'co', lift, n, w});
  }

  // --- force sim: d3-force, canvas rendering ---
  const simNodes = Array.from({length: N}, (_, i) => ({index: i}));
  const simLinks = [];
  for (const [a, b] of D.live) simLinks.push({source: a, target: b, s: 0.08});
  for (const [a, b, , , w] of D.co) simLinks.push({source: a, target: b, s: 0.05 * Math.min(1, w)});
  const sim = d3.forceSimulation(simNodes)
    .velocityDecay(0.65)
    .alphaDecay(0.04)
    .force('charge', d3.forceManyBody().strength(-26).distanceMax(280).theta(0.9))
    .force('link', d3.forceLink(simLinks).distance(36).strength(l => l.s))
    .force('collide', d3.forceCollide(i => R[i.index] + 1).iterations(1))
    .force('x', d3.forceX(0).strength(0.05))
    .force('y', d3.forceY(0).strength(0.05))
    .stop();
  function syncPositions() {
    for (let i = 0; i < N; i++) { px[i] = simNodes[i].x; py[i] = simNodes[i].y; }
  }
  syncPositions();
  // --- rendering ---
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  let W = 0, H = 0, dpr = 1;
  let tx = 0, ty = 0, scale = 1;
  function resize() {
    dpr = window.devicePixelRatio || 1;
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    if (!tx && !ty) { tx = W / 2; ty = H / 2; }
  }
  window.addEventListener('resize', resize); resize();

  let minLift = 20, showLive = true, showCo = true;
  let fitted = false;
  let hover = -1, sel = -1, searchHit = -1;
  let needsDraw = true;

  function neighborSet(i) {
    const s = new Set([i]);
    for (const e of adj[i]) if (e.t === 'import' || e.lift >= minLift) s.add(e.o);
    return s;
  }

  function curve(a, b) {
    const mx = (px[a] + px[b]) / 2, my = (py[a] + py[b]) / 2;
    const dx = px[b] - px[a], dy = py[b] - py[a];
    const bow = 0.14;
    ctx.moveTo(px[a], py[a]);
    ctx.quadraticCurveTo(mx - dy * bow, my + dx * bow, px[b], py[b]);
  }

  function fit() {
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (let i = 0; i < N; i++) {
      if (px[i] < x0) x0 = px[i]; if (px[i] > x1) x1 = px[i];
      if (py[i] < y0) y0 = py[i]; if (py[i] > y1) y1 = py[i];
    }
    const pad = 40;
    scale = Math.min((W - pad * 2) / (x1 - x0 + 1), (H - pad * 2) / (y1 - y0 + 1), 2);
    tx = W / 2 - (x0 + x1) / 2 * scale;
    ty = H / 2 - (y0 + y1) / 2 * scale;
  }

  function draw() {
    if (!fitted && sim.alpha() < 0.45) { fit(); fitted = true; }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.translate(tx, ty); ctx.scale(scale, scale);
    const focus = sel >= 0 ? sel : hover;
    const near = focus >= 0 ? neighborSet(focus) : null;

    ctx.lineWidth = 0.6 / scale;
    if (showLive) {
      ctx.strokeStyle = 'rgba(87,80,63,0.33)';
      ctx.beginPath();
      for (const [a, b] of D.live) {
        if (near && !(near.has(a) && near.has(b))) continue;
        curve(a, b);
      }
      ctx.stroke();
    }
    if (showCo) {
      const NB = 6, buckets = Array.from({length: NB}, () => []);
      for (const e of D.co) {
        if (e[2] < minLift) continue;
        if (near && !(near.has(e[0]) && near.has(e[1]))) continue;
        const t = Math.min(1, e[4] / 1.4);
        buckets[Math.min(NB - 1, (t * NB) | 0)].push(e);
      }
      ctx.strokeStyle = CO;
      for (let bi = 0; bi < NB; bi++) {
        if (!buckets[bi].length) continue;
        const t = (bi + 0.5) / NB;
        ctx.globalAlpha = Math.min(0.6, 0.08 + t * 0.5);
        ctx.lineWidth = (0.6 + t * 1.7) / scale;
        ctx.beginPath();
        for (const e of buckets[bi]) curve(e[0], e[1]);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
    for (let i = 0; i < N; i++) {
      const dim = near && !near.has(i);
      ctx.globalAlpha = dim ? 0.13 : 1;
      ctx.fillStyle = GC[D.nodes[i][1]];
      ctx.beginPath();
      ctx.arc(px[i], py[i], R[i] / Math.sqrt(scale), 0, 7);
      ctx.fill();
      if (i === focus || i === searchHit) {
        ctx.strokeStyle = '#e8e2d5';
        ctx.lineWidth = 1.4 / scale;
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
    // label the focused node and its brightest partners
    if (focus >= 0) {
      ctx.font = `${11 / scale}px ui-monospace, Menlo, monospace`;
      ctx.fillStyle = INK2;
      const labeled = [...near].slice(0, 14);
      for (const i of labeled) {
        const short = D.nodes[i][0].split('/').slice(-1)[0];
        ctx.fillText(short, px[i] + (R[i] + 3) / scale, py[i] + 3 / scale);
      }
    }
  }

  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced) {
    sim.tick(300); syncPositions(); fit(); fitted = true; draw();
  } else {
    sim.on('tick', () => { syncPositions(); needsDraw = true; })
       .on('end', () => { if (!fitted) { fit(); fitted = true; } needsDraw = true; })
       .restart();
    (function loop() {
      if (needsDraw) { draw(); needsDraw = false; }
      requestAnimationFrame(loop);
    })();
  }

  // --- interaction ---
  function pick(mx, my) {
    const x = (mx - tx) / scale, y = (my - ty) / scale;
    let best = -1, bd = 100;
    for (let i = 0; i < N; i++) {
      const dx = px[i] - x, dy = py[i] - y, d = dx * dx + dy * dy;
      const r = Math.max(R[i] / Math.sqrt(scale), 6 / scale);
      if (d < r * r && d < bd) { best = i; bd = d; }
    }
    return best;
  }
  const tip = document.getElementById('tip');
  let dragging = false, moved = false, lx = 0, ly = 0;
  cv.addEventListener('pointerdown', e => { dragging = true; moved = false; lx = e.offsetX; ly = e.offsetY; cv.classList.add('drag'); cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointerup', e => {
    dragging = false; cv.classList.remove('drag');
    if (!moved) { sel = pick(e.offsetX, e.offsetY); showSelection(); needsDraw = true; if (reduced) draw(); }
  });
  cv.addEventListener('pointermove', e => {
    if (dragging) {
      const dx = e.offsetX - lx, dy = e.offsetY - ly;
      if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
      tx += dx; ty += dy; lx = e.offsetX; ly = e.offsetY;
      needsDraw = true; if (reduced) draw();
      return;
    }
    const h = pick(e.offsetX, e.offsetY);
    if (h === hover) { if (h >= 0) { tip.style.left = Math.min(e.offsetX + 14, W - 390) + 'px'; tip.style.top = (e.offsetY + 14) + 'px'; } return; }
    hover = h;
    if (hover >= 0) {
      const n = D.nodes[hover];
      tip.style.display = 'block';
      const tw = 390;
      tip.style.left = Math.min(e.offsetX + 14, W - tw) + 'px';
      tip.style.top = (e.offsetY + 14) + 'px';
      tip.innerHTML = `<div class="p mono">${esc(n[0])}</div>
        <div class="m">${esc(names[n[1]])} · ${n[2]} live edge${n[2] === 1 ? '' : 's'} · co-change weight ${n[3]}</div>`;
    } else tip.style.display = 'none';
    needsDraw = true; if (reduced) draw();
  });
  cv.addEventListener('pointerleave', () => { hover = -1; tip.style.display = 'none'; needsDraw = true; if (reduced) draw(); });
  cv.addEventListener('wheel', e => {
    e.preventDefault();
    const f = Math.exp(-e.deltaY * 0.0012);
    const nx = e.offsetX, ny = e.offsetY;
    tx = nx - (nx - tx) * f; ty = ny - (ny - ty) * f;
    scale *= f;
    needsDraw = true; if (reduced) draw();
  }, { passive: false });

  // --- controls ---
  document.getElementById('lv').addEventListener('change', e => { showLive = e.target.checked; needsDraw = true; if (reduced) draw(); });
  document.getElementById('cc').addEventListener('change', e => { showCo = e.target.checked; needsDraw = true; if (reduced) draw(); });
  const lifto = document.getElementById('lifto');
  document.getElementById('lift').addEventListener('input', e => {
    minLift = +e.target.value; lifto.textContent = minLift; needsDraw = true; if (reduced) draw();
  });
  document.getElementById('q').addEventListener('input', e => {
    const q = e.target.value.toLowerCase();
    searchHit = -1;
    if (q.length >= 2) {
      for (let i = 0; i < N; i++) if (D.nodes[i][0].toLowerCase().includes(q)) { searchHit = i; break; }
      if (searchHit >= 0) {
        tx = W / 2 - px[searchHit] * scale; ty = H / 2 - py[searchHit] * scale;
        sel = searchHit; showSelection();
      }
    }
    needsDraw = true; if (reduced) draw();
  });

  // --- panel ---
  const body = document.getElementById('body');
  const tabs = { sel: document.getElementById('t-sel'), hid: document.getElementById('t-hid') };
  let tab = 'sel';
  function setTab(t) {
    tab = t;
    tabs.sel.setAttribute('aria-selected', t === 'sel');
    tabs.hid.setAttribute('aria-selected', t === 'hid');
    t === 'sel' ? showSelection() : showHidden();
  }
  tabs.sel.addEventListener('click', () => setTab('sel'));
  tabs.hid.addEventListener('click', () => setTab('hid'));

  function focusNode(i) {
    sel = i;
    tx = W / 2 - px[i] * scale; ty = H / 2 - py[i] * scale;
    setTab('sel');
    needsDraw = true; if (reduced) draw();
  }

  function showSelection() {
    if (tab !== 'sel') return;
    if (sel < 0) {
      body.innerHTML = `<p class="hint">Click a node (or search) to see what
        moves with that file: its live imports, and the files history says it
        drags along even without one.</p>`;
      return;
    }
    const n = D.nodes[sel];
    const partners = adj[sel].filter(e => e.t === 'import' || e.lift >= 2);
    const co = partners.filter(e => e.t === 'co').sort((a, b) => b.w - a.w);
    const imp = partners.filter(e => e.t === 'import');
    let html = `<div class="selpath mono">${esc(n[0])}</div>`;
    if (co.length) {
      html += `<h3>moves with (history)</h3>` + co.slice(0, 12).map(e => {
        const o = D.nodes[e.o];
        return `<button class="prow" data-n="${e.o}">
          <span class="f"><span class="dot" style="background:${GC[o[1]]}"></span>
          <span class="mono">${esc(o[0])}</span></span>
          <div class="m">${e.n}x together · lift ${e.lift}</div></button>`;
      }).join('');
    }
    if (imp.length) {
      html += `<h3>live imports</h3>` + imp.slice(0, 15).map(e => {
        const o = D.nodes[e.o];
        return `<button class="prow" data-n="${e.o}">
          <span class="f"><span class="dot" style="background:${GC[o[1]]}"></span>
          <span class="mono">${esc(o[0])}</span></span></button>`;
      }).join('');
    }
    if (!co.length && !imp.length) html += `<p class="hint">No recorded relationships above the current thresholds.</p>`;
    body.innerHTML = html;
    body.querySelectorAll('[data-n]').forEach(el =>
      el.addEventListener('click', () => focusNode(+el.dataset.n)));
  }

  function showHidden() {
    body.innerHTML = `<p class="hint">Pairs that change together (lift ≥ 8,
      3+ times) with <em>no live import between them</em> - coupling an import
      graph can't see.</p>` + D.hidden.map(([a, b, lift, n]) => `
      <button class="pair" data-n="${a}">
        <div class="f mono">${esc(D.nodes[a][0])}</div>
        <div class="f mono">${esc(D.nodes[b][0])}</div>
        <div class="m"><span class="kind co">co-change</span> ${n}x together · lift ${lift}</div>
      </button>`).join('');
    body.querySelectorAll('[data-n]').forEach(el =>
      el.addEventListener('click', () => focusNode(+el.dataset.n)));
  }
  showSelection();
})();
</script>
